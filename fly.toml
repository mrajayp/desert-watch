# Not deployed yet. Create with: fly apps create <name>; fly volumes create dw_data --size 1 --region <region>
app = "desert-watch"
primary_region = "lhr"

[build]

[env]
  DW_DATABASE_URL = "sqlite:////data/desert_watch.db"

[[mounts]]
  source = "dw_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The collectors run in-process (APScheduler): the machine must never auto-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
