# Deployed as desert-watch (lhr). Volume dw_data mounted at /data.
app = "desert-watch"
primary_region = "lhr"

# Swap on the root disk: heavy jobs (recompute, imports) slow down instead of OOM-killing the web
# process, which made Fly reboot the whole machine (2026-10-14/15).
swap_size_mb = 1024

[build]

[env]
  DW_DATABASE_URL = "sqlite:////data/desert_watch.db"

[[mounts]]
  source = "dw_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The collectors run in-process (APScheduler): the machine must never auto-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
