# Libya country config. Adding a country = adding a file like this one.
iso2: LY
iso3: LBY
name_en: Libya
name_ar: ليبيا
demonyms: [Libyan, Libyans, ليبي, ليبية, الليبي, الليبية, الليبيين]
gdelt:
  country_term: Libya            # added to every GDELT query (English translations)
  sourcecountry: LY              # FIPS code used by GDELT for outlets based in Libya
gnews:
  country_term_ar: ليبيا
  hl: ar
  gl: LY
  ceid: "LY:ar"
acled: {country: Libya}
ucdp: {country_id: 620}
reliefweb: {country_iso3: lby}
boundaries:
  # geoBoundaries gbHumanitarian LBY (source: UNITAR-UNOSAT, Libyan Bureau of Statistics,
  # WFP, IOM via HDX; licence CC BY 3.0 IGO). Files live in config/geo, served at /geo/.
  districts_geojson: libya_districts.geojson   # ADM2, 22 shabiyat; matched on `geo` below
  macro_geojson: libya_macro.geojson           # ADM1 East / West / South
  macro_geo_names: {tripolitania: West, cyrenaica: East, fezzan: South}
  attribution: "Boundaries: UNITAR-UNOSAT, Libyan Bureau of Statistics, WFP, IOM via HDX / geoBoundaries (CC BY 3.0 IGO)"

# Regions: macro (historic) regions -> districts (shabiyat, 2007 system).
# Jufra placed in Fezzan and Sirte in Tripolitania by convention; both are
# borderline and can be moved here without code changes.
macro_regions:
  - {slug: tripolitania, name_en: Tripolitania, name_ar: طرابلس الغرب}
  - {slug: cyrenaica, name_en: Cyrenaica, name_ar: برقة}
  - {slug: fezzan, name_en: Fezzan, name_ar: فزان}

districts:
  - {slug: tripoli, macro: tripolitania, geo: "Tripoli", name_en: Tripoli, name_ar: طرابلس, aliases: [Tripoli, Tajoura, Janzour, طرابلس, تاجوراء, جنزور]}
  - {slug: jafara, macro: tripolitania, geo: "Aljfara", name_en: Jafara, name_ar: الجفارة, aliases: [Jafara, Aziziya, Al-Aziziya, Qasr bin Ghashir, الجفارة, العزيزية, قصر بن غشير]}
