# Outlets. Only uncontested facts are seeded here (name, domain, language,
# medium, scope). Base city and political alignment are left for admins to
# fill in WITH evidence. Outlets placed by base city with confidence
# "unverified" show as such until someone confirms them. Outlets seen via
# Google News / GDELT are auto-created as "unclassified".
# rss: feeds verified working 2026-10-12. Al Wasat, Al Marsad and InfoMigrants
# returned 403; Libya Observer and LANA feeds 404. These are still covered via
# Google News.
outlets:
  - {name: Libya Herald, domain: libyaherald.com, languages: [en], medium: website, scope: libyan, rss: "https://www.libyaherald.com/feed/"}
  - {name: Libya Review, domain: libyareview.com, languages: [en], medium: website, scope: libyan, rss: "https://libyareview.com/feed/"}
