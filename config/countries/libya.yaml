# Libya country config. Adding a country = adding a file like this one.
iso2: LY
iso3: LBY
name_en: Libya
name_ar: ليبيا
demonyms: [Libyan, Libyans, ليبي, ليبية, الليبي, الليبية, الليبيين]
gdelt:
  country_term: Libya            # added to every GDELT query (English translations)
  sourcecountry: LY              # FIPS code used by GDELT for outlets based in Libya
gnews:
  country_term_ar: ليبيا
  # Google News has no Libya edition. gl=LY answers with a redirect to the Egypt-Arabic edition
  # (checked 2026-10-16), so we ask for that edition by name. hl/gl/ceid are the first Arabic edition,
  # read by the official-statements collector; `editions` is the full list the theme searches
  # (collectors/gnews.py) run, per language. A second Arabic entry doubles the Arabic requests: the
  # edition experiment (docs/research/gnews_editions_2026-10-19.md, scripts/compare_gnews_editions.py)
  # measured what each edition adds before any is added here.
  hl: ar
  gl: EG
  ceid: "EG:ar"
  editions:
    - {lang: ar, hl: ar, gl: EG, ceid: "EG:ar"}
    - {lang: en, hl: en-GB, gl: GB, ceid: "GB:en"}
  # The editions the social-post search (collectors/gnews_social.py) asks, one per language: Google
  # News keeps to the edition's language, and the English one that returned x.com posts was en-US.
  social_editions:
    ar: {hl: ar, gl: EG, ceid: "EG:ar"}
    en: {hl: en-US, gl: US, ceid: "US:en"}
  # Daily site: searches for the Libyan majors that offer no feed (403/404 from Fly), run by the gnews
  # collector with the theme searches (same windows, same re-query at the settle ages). Results are
  # stored only when a theme rule matches, as feed items are; they fill the gnews|outlet pair the theme
  # searches already feed. kind: article (the official_queries machinery, for news rather than statements).
  outlet_queries:
    - {label: LANA, domain: lana.gov.ly, lang: ar, query: 'site:lana.gov.ly'}
    - {label: Al Wasat, domain: alwasat.ly, lang: ar, query: 'site:alwasat.ly'}
    - {label: Libya Observer, domain: libyaobserver.ly, lang: en, query: 'site:libyaobserver.ly'}
    - {label: Al Marsad, domain: almarsad.co, lang: ar, query: 'site:almarsad.co'}
acled: {country: Libya}
ucdp: {country_id: 620}
reliefweb: {country_iso3: lby}
boundaries:
  # geoBoundaries gbHumanitarian LBY (source: UNITAR-UNOSAT, Libyan Bureau of Statistics,
  # WFP, IOM via HDX; licence CC BY 3.0 IGO). Files live in config/geo, served at /geo/.
  districts_geojson: libya_districts.geojson   # ADM2, 22 shabiyat; matched on `geo` below
  macro_geojson: libya_macro.geojson           # ADM1 East / West / South
  macro_geo_names: {tripolitania: West, cyrenaica: East, fezzan: South}
  attribution: "Boundaries: UNITAR-UNOSAT, Libyan Bureau of Statistics, WFP, IOM via HDX / geoBoundaries (CC BY 3.0 IGO)"
  attribution_ar: "الحدود: يونيتار-يونوسات، مصلحة الإحصاء والتعداد الليبية، برنامج الأغذية العالمي، المنظمة الدولية للهجرة، عبر HDX / geoBoundaries (CC BY 3.0 IGO)"

