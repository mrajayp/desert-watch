# Official sources: a separate stream, not counted as media coverage.
#   kind: statement = UN / embassy / government statements; report = humanitarian reports (need lens)
# Feeds verified 2026-10-13. UNSMIL (404), US Embassy (403), Devex (403) block direct feeds, so
# they come in via Google News site: queries below.
official_feeds:
  - {name: ReliefWeb (Libya), domain: reliefweb.int, kind: report, libya_specific: true, url: "https://reliefweb.int/updates/rss.xml?legacy-river=country/lby"}
  - {name: UN in Libya, domain: libya.un.org, kind: statement, libya_specific: true, url: "https://libya.un.org/en/rss.xml"}
  - {name: GOV.UK (Libya), domain: gov.uk, kind: statement, libya_specific: true, url: "https://www.gov.uk/search/news-and-communications.atom?world_locations%5B%5D=libya"}
# UN News (news.un.org) blocks Fly's IP range (every page 404s from the server, 2026-10-14), so it
# comes in via Google News site: queries below.
# require: a headline must contain one of these to count (statement-ness); exclude: veto words.
official_statement_words: [بيان, تدين, يدين, ترحب, يرحب, تدعو, يدعو, تعرب, يعرب, تؤكد, يؤكد, أكدت, أكد, تصريح, تحذر, يحذر, تطالب, يطالب,
  statement, welcomes, condemns, "calls on", urges, expresses, stresses, warns, "press release", remarks]
official_exclude_words: [Map, Coordinator, Officer, Vacancy, Consultant, Specialist, Assistant, Internship, Intern, "Terms of Reference",
  وظيفة, مباراة, البطولة, كرة]
official_queries:
  - {kind: statement, lang: en, label: UNSMIL, libya_specific: true, query: 'site:unsmil.unmissions.org'}
  - {kind: statement, lang: en, label: UNSMIL statements, require_statement: true, query: 'UNSMIL (statement OR welcomes OR condemns OR "calls on")'}
  - {kind: statement, lang: ar, label: UNSMIL statements (AR), require_statement: true, query: '"البعثة الأممية" ليبيا (بيان OR ترحب OR تدين OR تدعو)'}
  - {kind: statement, lang: en, label: Embassy statements, require_statement: true, query: 'Libya (embassy OR ambassador OR "chargé d''affaires") statement'}
  - {kind: statement, lang: ar, label: Embassy statements (AR), require_statement: true, query: 'ليبيا (سفارة OR السفير OR "القائم بالأعمال") بيان'}
  - {kind: statement, lang: en, label: US Embassy, libya_specific: true, query: 'site:ly.usembassy.gov'}
  - {kind: statement, lang: en, label: EU delegation, query: 'site:eeas.europa.eu Libya'}
  - {kind: statement, lang: en, label: UN News, query: 'site:news.un.org Libya'}
  - {kind: statement, lang: ar, label: UN News (AR), query: 'site:news.un.org ليبيا'}
  - {kind: report, lang: en, label: ReliefWeb, query: 'site:reliefweb.int Libya'}
  - {kind: article, lang: en, label: Devex, query: 'site:devex.com Libya'}

