# Hand-written Google Alerts aimed at likely deserts (south, minorities, recovery).
# Generated district/theme alerts come from the lists above; see `python -m app.cli alerts-list`.
extra_alerts:
  - {key: south_services, lang: ar, region: fezzan, theme: services, label: "Fezzan public services (AR)", query: '(فزان OR "الجنوب الليبي") (كهرباء OR وقود OR مستشفى OR مياه)'}
  - {key: south_services, lang: en, region: fezzan, theme: services, label: "Fezzan public services (EN)", query: '(Fezzan OR "southern Libya") (electricity OR fuel OR hospital OR water)'}
  - {key: kufra_migration, lang: ar, region: kufra, theme: migration, label: "Kufra migration (AR)", query: 'الكفرة (مهاجرين OR السودانيين OR لاجئين)'}
  - {key: kufra_migration, lang: en, region: kufra, theme: migration, label: "Kufra migration (EN)", query: 'Kufra (migrants OR Sudanese OR refugees)'}
  - {key: tebu_tuareg, lang: ar, label: "Tebu & Tuareg communities (AR)", query: '(التبو OR الطوارق) ليبيا'}
  - {key: tebu_tuareg, lang: en, label: "Tebu & Tuareg communities (EN)", query: '(Tebu OR Toubou OR Tuareg) Libya'}
  - {key: amazigh, lang: ar, label: "Amazigh (AR)", query: '(الأمازيغ OR الأمازيغية) ليبيا'}
  - {key: amazigh, lang: en, label: "Amazigh (EN)", query: '(Amazigh OR Berber) Libya'}
  - {key: derna_recovery, lang: ar, region: derna, label: "Derna recovery (AR)", query: 'درنة (الإعمار OR السيول OR السد)'}
