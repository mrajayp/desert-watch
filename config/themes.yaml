# Seed themes. After first seed these live in the database and are edited in the
# admin UI; editing bumps the theme version and re-scores that theme's history.
#
# en_terms  : English terms. Used for RSS matching AND GDELT queries (GDELT only
#             searches English machine translations, so never put Arabic here).
# ar_terms  : Arabic terms. RSS / Google News matching only. Write them
#             un-normalised; the classifier normalises alef/ya/ta-marbuta/diacritics.
# exclude   : terms that veto a match (both languages).
# acled_event_types / reliefweb_themes : need-lens mappings, used once keys arrive.

