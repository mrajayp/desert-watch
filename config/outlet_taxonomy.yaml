# Outlet category dimensions. Values are editable per country in the admin UI.
# Every assignment of a contested dimension needs an evidence URL, a confidence
# level and dates. See plan: "Handling contested labels".
dimensions:
  - key: type
    name: Ownership type
    contested: false
    values: [state, private, public_service, ngo_un, citizen_collective, international, unknown]
  - key: scope
    name: Scope
    contested: false
    values: [libyan, diaspora, international, unknown]
  - key: alignment
    name: Political alignment
    contested: true
    country: LY
    values: [tripoli_gnu_aligned, east_lna_aligned, independent, islamist_leaning, tribal_local, unknown]
  - key: medium
    name: Medium
    contested: false
    values: [website, tv, radio, facebook, telegram, x, print]
  - key: reach
    name: Reach tier
    contested: false
    values: [national, regional, local, niche, unknown]
  # Labels as published in the 2023-24 social-media scrape ("Social Media scraped data").
  # Kept apart from `alignment`: they never drive filters or the partisan-only flag.
  - key: scrape_source_type
    name: "Social-media scrape: source type (2023-24)"
    contested: true
    third_party: true
    values: [authentic, inauthentic]
  - key: scrape_affiliation
    name: "Social-media scrape: affiliation (2023-24)"
    contested: true
    third_party: true
    values: [Pro-LNA, Anti-LNA, Pro-GNU, Anti-GNU, Pro-Gaddafi, Tribal, Egypt, KSA, Turkey, UAE, Unavailable]
confidence_levels: [reported, likely, disputed, unverified]
