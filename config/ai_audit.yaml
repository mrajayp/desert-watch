# AI answers audit: which outlets AI assistants search and cite when asked about Libya.
# Scope and method: docs/research/ai_answers_audit_scope.md. Owner decision 2026-10-18:
# "Claude plus ChatGPT, $1 cap, build it". Perplexity was added the same day in the second build
# (owner: "yes", "ok, go ahead"), inside the same cap; it waits for PERPLEXITY_API_KEY.
#
# Once a week (Monday 04:20 UTC, jobs.start_scheduler) every question in config/countries/<country>.yaml
# (ai_audit.questions) is asked in Arabic and in English, one new conversation each, ordered question,
# then language, then assistant, so a cap stop leaves balanced coverage. Results are never scored:
# the audit writes only its own tables (ai_run, ai_answer, ai_source).
# Prices: config/ai_audit_prices.yaml (dated, with official sources).

# One cap for ALL assistants together, in US dollars. Before each answer the runner checks
# spent this week + estimate <= cap; if not, the remaining answers are recorded as over_budget.
weekly_cap_usd: 1.0

# Searches per question (Anthropic max_uses, OpenAI max_tool_calls, Perplexity max_steps and
# max_tool_calls).
max_searches: 2

# Who sees results: admins | team (every signed-in user). Admins only for the first 4 weeks.
visible_to: admins

# A one-line system prompt giving today's date, and nothing else (the "this week" questions need it).
date_line: true

# Sent as the user's location. OpenAI defaults to the United States when it is left out. If Anthropic
# rejects country LY, the provider resends city and timezone only and records what it sent. Perplexity
# takes country, region and city (no timezone) and falls back the same way, to region and city.
location: {city: Tripoli, region: Tripoli, country: LY, timezone: Africa/Tripoli}

# The assistants. ANTHROPIC_API_KEY is the digest's key; OPENAI_API_KEY and PERPLEXITY_API_KEY are set
# by the owner as Fly secrets (until then the run records awaiting_key). Never put a key in this file.
providers:
  anthropic: {enabled: true}
  openai: {enabled: true}
  perplexity: {enabled: true}

# Size of one answer for the pre-call budget check (the real cost is computed from the usage). Kept on
# the high side so the last answer before the cap cannot overshoot it: output is the max_tokens /
# max_output_tokens ceiling of one request (4000) and input about twice a typical two-search answer.
# At the listed rates one answer is estimated at USD 0.028 for Claude and ChatGPT (USD 0.02 of it the
# two searches) and USD 0.030 for Perplexity (dearer output tokens, cheaper searches). With all three
# assistants the 48 answers of a week add up to USD 1.38 at these estimates, so a dry run shows only
# about 34 of them fitting. The real costs are far lower: a typical week is about USD 0.75 for Claude
# and ChatGPT plus about USD 0.15 for Perplexity (2 searches, about 9,000 tokens in and 700 out per
# answer, an estimate until the first real run). If a week does reach the cap, its last answers are
# recorded as over_budget, spread evenly across the assistants by the question order.
estimate: {input_tokens: 60000, output_tokens: 4000}
