[project]
name = "desert-watch"
version = "0.1.0"
description = "Information-desert tracker: need vs monitored coverage, by country, theme and region"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.10,<4",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "anthropic>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["simulation: a statistical simulation of the verdict (runs in under a minute)"]
