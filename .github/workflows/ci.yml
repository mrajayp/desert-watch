# Continuous integration (plan C-R1.10): the backend test suite and the front-end build on every push
# and pull request. No secrets: the tests run on a temporary SQLite file and the build needs nothing
# from the network but the npm registry. A newer run on the same branch cancels the older one.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # the interpreter the image (python:3.13-slim) and the laptop venv run; the lock allows >=3.12
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked)
        run: uv sync --frozen
      - name: Test
        env:
          DW_SCHEDULER: "0"
        run: uv run pytest -q -p no:cacheprovider

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (locked)
        run: npm ci --no-audit --no-fund
      - name: Build (component check, i18n check, node tests, Vite)
        run: npm run build
